name: Deploy no GitHub Pages

# push: cobre commits feitos por voce (interface web, git local).
# workflow_dispatch: permite disparar pela API — e o unico caminho que
# funciona para commits vindos da sessao do Claude, cuja credencial nao
# dispara workflow por push.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# nao cancela um deploy em andamento pela metade
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
